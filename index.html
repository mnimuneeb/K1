<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A birthday gift made just for you.">
  <title>Happy Birthday, Kawi!</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="navigation.css">
<script src="navigation.js" defer></script>
</head>
<body>
  <!-- Opening animation: script.js controls the circle and typing sequence. -->
  <div id="welcome" class="welcome" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
    <div class="welcome__stage">
      <div id="entry-animation" class="welcome__animation" aria-hidden="true"></div>
      <h1 id="welcome-title" class="welcome__title"></h1>
    </div>
  </div>

  <!-- Introduction shown after the opening animation finishes. -->
  <main>
    <section id="intro" class="intro" aria-labelledby="intro-heading">
      <div class="intro__content">
        <h2 id="intro-heading" class="intro__headline" aria-live="polite">
          <span id="dynamic-text">Buddy</span>
        </h2>

        <p class="intro__text">
          I built this little world just for you. Take a moment, get comfy, and explore your gift.
        </p>

        <a href="celebrate.html" id="start-btn" class="btn btn--primary btn--large">
          Let's go in
        </a>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
